[program:ai-police-backend]
directory=/opt/ai-police-sim/backend
command=/opt/ai-police-sim/backend/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8001
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
user=ubuntu
stdout_logfile=/var/log/ai-police-sim/backend.out.log
stderr_logfile=/var/log/ai-police-sim/backend.err.log
environment=HOME="/home/ubuntu",PATH="/opt/ai-police-sim/backend/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
