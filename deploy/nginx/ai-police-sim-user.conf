user panglihao developer;
worker_processes auto;
pid /home/panglihao/ai-police-sim/ai-police-https-5175.pid;
error_log /home/panglihao/ai-police-sim/logs/user-nginx-error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time';
    access_log /home/panglihao/ai-police-sim/logs/user-nginx-access.log timed;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 5175 ssl default_server;
        listen [::]:5175 ssl default_server;
        server_name _;

        ssl_certificate /home/panglihao/ai-police-sim/certs/ai-police-82.156.126.212.crt;
        ssl_certificate_key /home/panglihao/ai-police-sim/certs/ai-police-82.156.126.212.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ai_police_tls:10m;
        ssl_session_timeout 10m;

        client_max_body_size 512m;

        location = /healthz {
            proxy_pass http://127.0.0.1:15176/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /mediapipe/ {
            alias /home/panglihao/ai-police-sim/frontend/dist/mediapipe/;
            add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
            try_files $uri =404;
        }

        location /assets/ {
            alias /home/panglihao/ai-police-sim/frontend/dist/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /favicon.svg {
            alias /home/panglihao/ai-police-sim/frontend/dist/favicon.svg;
            add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        }

        location = /icons.svg {
            alias /home/panglihao/ai-police-sim/frontend/dist/icons.svg;
            add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
        }

        location ~ ^/(ai-police-media|ai-police-private)/ {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /speech {
            proxy_pass http://127.0.0.1:15176;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/(auth|face|training|cases|classes|videos|video-training|dashboard|knowledge)(/|$) {
            proxy_pass http://127.0.0.1:15176;
            proxy_request_buffering off;
            client_body_timeout 600s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:15176/api/;
            proxy_request_buffering off;
            client_body_timeout 600s;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:15176/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /object-storage/ {
            proxy_pass http://127.0.0.1:15176/object-storage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /avatars/ {
            proxy_pass http://127.0.0.1:15176/avatars/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            root /home/panglihao/ai-police-sim/frontend/dist;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }
}
