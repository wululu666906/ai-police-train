# Let's Encrypt IP 证书（shortlived ~6 天，需 certbot renew 自动续期）
# 80：ACME http-01 校验 + 其余跳转 HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host:5175$request_uri;
    }
}

server {
    listen 5175 ssl default_server;
    listen [::]:5175 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/ai-police-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-police-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 512m;

    location /api/ {
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 600s;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /speech {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /favicon.svg {
        proxy_pass http://127.0.0.1:8001;
    }

    location = /icons.svg {
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
