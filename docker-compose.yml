# 默认单容器：docker compose up -d --build
# 浏览器访问 http://127.0.0.1:5555（WEB_PORT）
# 拆分部署（Nginx 前端 + API）：docker compose --profile split up -d --build api frontend
services:
  ai-workflow:
    build:
      context: .
      dockerfile: ai_workflow_service/Dockerfile
    image: ai-police-workflow:latest
    container_name: ai_police_workflow
    env_file:
      - ./backend/.env
    environment:
      AI_WORKFLOW_DATA_DIR: /app/ai_workflow_service/data
      AI_WORKFLOW_INTERNAL_TOKEN: ${AI_WORKFLOW_INTERNAL_TOKEN:-}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_REASONING_MODE: ${DEEPSEEK_REASONING_MODE:-disabled}
      TINY_TROUPE_MODE: ${TINY_TROUPE_MODE:-world}
      TINY_TROUPE_MAX_ACTORS: ${TINY_TROUPE_MAX_ACTORS:-6}
      TINY_TROUPE_MODEL_CONCURRENCY: ${TINY_TROUPE_MODEL_CONCURRENCY:-6}
      TINY_TROUPE_MAX_TOKENS: ${TINY_TROUPE_MAX_TOKENS:-1600}
    ports:
      - "${AI_WORKFLOW_PORT:-8020}:8020"
    volumes:
      - ./ai_workflow_service/data:/app/ai_workflow_service/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: ai-police-sim:unified
    container_name: ai_police_app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///data/ai_police.db
      CHROMA_DB_PATH: data/chroma_db
      VIDEO_ANALYSIS_PROVIDER: ${VIDEO_ANALYSIS_PROVIDER:-qwen}
      VIDEO_ANALYSIS_MODEL: ${VIDEO_ANALYSIS_MODEL:-qwen-plus}
      VIDEO_ASR_CHUNK_SECONDS: ${VIDEO_ASR_CHUNK_SECONDS:-30}
      PORT: "8000"
      AI_WORKFLOW_URL: http://ai-workflow:8020
      AI_WORKFLOW_INTERNAL_TOKEN: ${AI_WORKFLOW_INTERNAL_TOKEN:-}
      AI_WORKFLOW_TIMEOUT_SECONDS: ${AI_WORKFLOW_TIMEOUT_SECONDS:-120}
    ports:
      - "${WEB_PORT:-5555}:8000"
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    profiles: ["split"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-police-sim:api
    container_name: ai_police_api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///data/ai_police.db
      CHROMA_DB_PATH: data/chroma_db
      VIDEO_ANALYSIS_PROVIDER: ${VIDEO_ANALYSIS_PROVIDER:-qwen}
      VIDEO_ANALYSIS_MODEL: ${VIDEO_ANALYSIS_MODEL:-qwen-plus}
      VIDEO_ASR_CHUNK_SECONDS: ${VIDEO_ASR_CHUNK_SECONDS:-30}
      PORT: "8000"
      AI_WORKFLOW_URL: http://ai-workflow:8020
      AI_WORKFLOW_INTERNAL_TOKEN: ${AI_WORKFLOW_INTERNAL_TOKEN:-}
      AI_WORKFLOW_TIMEOUT_SECONDS: ${AI_WORKFLOW_TIMEOUT_SECONDS:-120}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    profiles: ["split"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: ai-police-sim:frontend
    container_name: ai_police_frontend
    ports:
      - "${WEB_PORT:-5555}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
