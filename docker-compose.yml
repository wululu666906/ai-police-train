# 默认单容器：docker compose up -d --build
# 浏览器访问 http://127.0.0.1:5555（WEB_PORT）
# 拆分部署（Nginx 前端 + API）：docker compose --profile split up -d --build api frontend
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: ai-police-sim:unified
    container_name: ai_police_app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///data/ai_police.db
      CHROMA_DB_PATH: data/chroma_db
      INSIGHTFACE_MODEL_DIR: /app/backend/data/face_models
      FACE_ENGINE_WARMUP: "1"
      PORT: "8000"
    ports:
      - "${WEB_PORT:-5555}:8000"
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    profiles: ["split"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-police-sim:api
    container_name: ai_police_api
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///data/ai_police.db
      CHROMA_DB_PATH: data/chroma_db
      INSIGHTFACE_MODEL_DIR: /app/data/face_models
      FACE_ENGINE_WARMUP: "1"
      PORT: "8000"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    profiles: ["split"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: ai-police-sim:frontend
    container_name: ai_police_frontend
    ports:
      - "${WEB_PORT:-5555}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
