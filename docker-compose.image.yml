services:
  ai-workflow:
    image: ${AI_WORKFLOW_IMAGE:-ai-police-workflow:latest}
    build:
      context: .
      dockerfile: ai_workflow_service/Dockerfile
    container_name: ai_police_workflow
    env_file:
      - ./backend/.env
    environment:
      AI_WORKFLOW_DATA_DIR: /app/ai_workflow_service/data
      AI_WORKFLOW_INTERNAL_TOKEN: ${AI_WORKFLOW_INTERNAL_TOKEN:-}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_REASONING_MODE: ${DEEPSEEK_REASONING_MODE:-disabled}
      TINY_TROUPE_MODE: ${TINY_TROUPE_MODE:-world}
      TINY_TROUPE_MAX_ACTORS: ${TINY_TROUPE_MAX_ACTORS:-24}
      TINY_TROUPE_MODEL_CONCURRENCY: ${TINY_TROUPE_MODEL_CONCURRENCY:-1}
      TINY_TROUPE_MAX_TOKENS: ${TINY_TROUPE_MAX_TOKENS:-1600}
    ports:
      - "${AI_WORKFLOW_BIND:-127.0.0.1}:${AI_WORKFLOW_PORT:-8020}:8020"
    volumes:
      - ./ai_workflow_service/data:/app/ai_workflow_service/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  app:
    image: ${APP_IMAGE:-ghcr.io/wululu666906/ai-police-train:codex-github-deploy-bundle}
    container_name: ai_police_app
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///data/ai_police.db
      CHROMA_DB_PATH: data/chroma_db
      FFMPEG_BINARY: ffmpeg
      VIDEO_ANALYSIS_PROVIDER: ${VIDEO_ANALYSIS_PROVIDER:-qwen}
      VIDEO_ANALYSIS_MODEL: ${VIDEO_ANALYSIS_MODEL:-qwen-plus}
      VIDEO_ASR_CHUNK_SECONDS: ${VIDEO_ASR_CHUNK_SECONDS:-60}
      VIDEO_ASR_PARALLELISM: ${VIDEO_ASR_PARALLELISM:-2}
      VIDEO_ANALYSIS_PIPELINE: ${VIDEO_ANALYSIS_PIPELINE:-single_step_v2}
      VIDEO_HLS_SEGMENT_SECONDS: ${VIDEO_HLS_SEGMENT_SECONDS:-10}
      INSIGHTFACE_MODEL_DIR: /app/backend/data/face_models
      FACE_ENGINE_WARMUP: "1"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      LOCAL_OBJECT_STORAGE_DIR: /app/backend/data/object_storage
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://82.156.126.212:5175}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-ai-police}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-this-minio-secret}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-ai-police-media}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE:-ai-police-private}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      OBJECT_SIGNED_URL_EXPIRE_SECONDS: ${OBJECT_SIGNED_URL_EXPIRE_SECONDS:-7200}
      AI_WORKFLOW_URL: ${AI_WORKFLOW_HOST_URL:-http://ai_police_workflow:8020}
      AI_WORKFLOW_INTERNAL_TOKEN: ${AI_WORKFLOW_INTERNAL_TOKEN:-}
      AI_WORKFLOW_TIMEOUT_SECONDS: ${AI_WORKFLOW_TIMEOUT_SECONDS:-900}
      CASE_IMPORT_TIMEOUT_SECONDS: ${CASE_IMPORT_TIMEOUT_SECONDS:-900}
      PORT: "8000"
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5555}:8000"
    volumes:
      - ./data:/app/backend/data
    depends_on:
      minio:
        condition: service_healthy
      ai-workflow:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  minio:
    image: minio/minio:latest
    container_name: ai_police_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-ai-police}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-this-minio-secret}
    ports:
      - "${MINIO_BIND:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
