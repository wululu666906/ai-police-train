server {
    listen 80;
    server_name localhost;
    charset utf-8;
    charset_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态文件托管
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到 api 容器（docker compose --profile split）
    location /api/ {
        client_max_body_size 512m;
        # Forward upload chunks as they arrive instead of buffering an entire
        # video to Nginx's temporary disk before the API receives it.
        proxy_request_buffering off;
        proxy_buffering off;
        client_body_timeout 600s;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 增加超时时间以适应较长的 AI 模型响应
        proxy_read_timeout 3600s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /speech {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
    }
}
